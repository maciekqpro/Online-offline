<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>maciekqpro – status w Roblox</title>
<style>
  :root { --bg:#eef0f2; --on:#178a47; --off:#6b7280; --text:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14161a; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; padding: 16px; background: var(--bg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .box { width: min(360px, 100%); padding: 40px 24px; border-radius: 20px; text-align: center; color: var(--text); background: var(--off); transition: background .3s; }
  .box.on { background: var(--on); }
  .nick { font-size: 1rem; opacity: .85; }
  .state { margin-top: 6px; font-size: 2.2rem; font-weight: 700; }
  .time { min-height: 1.2em; margin-top: 14px; font-size: 2.6rem; font-weight: 600; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="box" class="box">
  <div class="nick">maciekqpro</div>
  <div id="state" class="state">ładowanie…</div>
  <div id="time" class="time"></div>
</div>
<script>
  var since = null;
  var $ = function (id) { return document.getElementById(id); };
  var pad = function (n) { return String(n).padStart(2, "0"); };

  function tick() {
    if (!since) { $("time").textContent = ""; return; }
    var s = Math.max(0, Math.floor((Date.now() - since) / 1000));
    $("time").textContent = pad(Math.floor(s / 3600)) + ":" + pad(Math.floor(s % 3600 / 60)) + ":" + pad(s % 60);
  }

  async function load() {
    try {
      var r = await fetch("status.json?t=" + Date.now(), { cache: "no-store" });
      var d = await r.json();
      since = d.active && d.since ? new Date(d.since).getTime() : null;
      $("box").className = "box" + (d.active ? " on" : "");
      $("state").textContent = d.active ? "aktywny" : "nieaktywny";
      tick();
    } catch (e) {
      since = null;
      $("box").className = "box";
      $("state").textContent = "brak danych";
      tick();
    }
  }

  load();
  setInterval(load, 60000);
  setInterval(tick, 1000);
</script>
</body>
</html>
